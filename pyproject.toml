[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartotui"
version = "0.13.0"
description = "Interactive ASCII map viewer for the terminal — vector and raster tile rendering."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SAMS0N1TE" }]
requires-python = ">=3.9"
keywords = ["map", "tui", "ascii", "openstreetmap", "terminal", "pmtiles", "vector-tiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Terminals",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "requests>=2.31",
    "pmtiles>=3.4",
    "pyserial>=3.5",
    # numpy and Pillow are the two compiled dependencies, and both sit on the
    # frame path. The floors are per-Python because a floor low enough to
    # predate the running interpreter lets pip fall back to building from
    # source, and a source-built numpy measured about a quarter slower on the
    # cell renderer than the released wheel. Each is the first release shipping
    # a wheel for that CPython; raise them when supporting a newer one.
    "numpy>=1.26; python_version < '3.13'",
    "numpy>=2.1; python_version == '3.13'",
    "numpy>=2.3; python_version >= '3.14'",
    "Pillow>=10.0.0; python_version < '3.13'",
    "Pillow>=10.4.0; python_version == '3.13'",
    "Pillow>=11.3.0; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Fallback MVT decoder, for tiles the bundled pure-python one cannot parse.
# Not a fast path: the bundled decoder always runs first and this is only
# reached when it raises.
fastmvt = [
    "mapbox-vector-tile>=2.0",
]

[project.scripts]
cartotui = "cartotui.cli:main"
cartotui-config = "cartotui.configure:main"

[project.urls]
Homepage = "https://github.com/SAMS0N1TE/CartoTUI"
Issues = "https://github.com/SAMS0N1TE/CartoTUI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cartotui*"]

[tool.setuptools.package-data]
cartotui = ["*.json", "themes/*.json", "resources/*.json", "data/*.gz"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E701", "E702", "E731", "B007"]

[tool.ruff.lint.per-file-ignores]
"cartotui/ui/widgets/__init__.py" = ["F401"]
"cartotui/traffic/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
